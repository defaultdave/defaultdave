name: OSV-Scanner

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "29 5 * * 1"

concurrency:
  group: osv-scanner-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Pull requests fail only on vulnerabilities they add.
  scan-pr:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml

  # Pushes to main and the weekly run report everything.
  scan-all:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
